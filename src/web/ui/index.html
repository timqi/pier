<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pier</title>
</head>
<body class="grid h-screen grid-cols-[240px_minmax(0,1fr)_400px] text-sm text-neutral-800 antialiased">
  <aside class="flex flex-col overflow-hidden border-r border-neutral-200 bg-neutral-50">
    <header class="flex items-center justify-between gap-2 px-4 py-3">
      <h1 class="text-base font-semibold tracking-tight">Pier</h1>
      <button id="new-session" class="btn btn-primary">New</button>
    </header>
    <ul id="session-list" class="flex-1 overflow-y-auto"></ul>
  </aside>

  <main class="flex min-w-0 flex-col overflow-hidden">
    <div id="turns" class="flex-1 space-y-3 overflow-y-auto px-6 py-4"></div>
    <form id="composer" class="flex flex-col gap-2 border-t border-neutral-200 p-4">
      <textarea id="input" rows="3"
        class="w-full resize-y rounded-lg border border-neutral-300 p-2.5 focus:border-indigo-400 focus:outline-none"
        placeholder="Message… (! prefix steers while streaming)"></textarea>
      <div class="flex items-center gap-2">
        <span id="mode-hint" class="mr-auto text-xs text-neutral-500"></span>
        <button type="button" id="abort" class="btn text-red-600">Abort</button>
        <button type="button" id="send-steer" class="btn">Steer</button>
        <button type="button" id="send-queue" class="btn">Queue</button>
        <button type="submit" id="send" class="btn btn-primary">Send</button>
      </div>
    </form>
  </main>

  <aside class="flex flex-col overflow-hidden border-l border-neutral-200 bg-neutral-50">
    <header class="px-4 py-3">
      <h2 class="text-xs font-semibold uppercase tracking-wide text-neutral-500">Timeline</h2>
    </header>
    <ul id="timeline" class="flex-1 overflow-y-auto px-2 pb-2 text-xs"></ul>
  </aside>

  <script type="module" src="/main.ts"></script>
</body>
</html>
