<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pier</title>
</head>
<body class="grid h-screen grid-cols-[230px_minmax(0,1fr)] text-[16px] leading-[1.45] text-neutral-800 antialiased">
  <aside class="flex flex-col overflow-hidden border-r border-neutral-200 bg-neutral-50">
    <header class="flex items-center justify-between gap-2 px-3 py-2">
      <h1 class="text-[15px] font-semibold tracking-tight">Pier</h1>
      <button id="new-session" class="btn btn-primary text-[13px]">New</button>
    </header>
    <ul id="session-list" class="flex-1 overflow-y-auto text-[13.5px]"></ul>
  </aside>

  <main class="flex min-w-0 flex-col overflow-hidden">
    <header class="flex h-10 flex-none items-center gap-2 border-b border-neutral-200 px-4">
      <span id="chat-title" class="truncate font-medium"></span>
      <span id="chat-cwd" class="truncate font-mono text-[12px] text-neutral-400"></span>
      <select id="model-select" class="ml-auto max-w-56 flex-none cursor-pointer truncate rounded-md border border-neutral-200 bg-white px-1.5 py-0.5 text-[12px] text-neutral-600 focus:outline-none"></select>
    </header>
    <div id="turns" class="flex-1 overflow-y-auto pb-4 pt-1"></div>
    <div id="queue-panel" class="hidden flex-col gap-1 border-t border-amber-200 bg-amber-50/60 px-3 py-2">
      <div class="flex items-center">
        <span class="text-[11px] font-semibold uppercase tracking-wide text-amber-700">Queued</span>
        <button type="button" id="queue-recall" class="ml-auto text-[12px] text-amber-700 underline-offset-2 hover:underline">Recall all</button>
      </div>
      <ul id="queue-rows" class="flex flex-col gap-1"></ul>
    </div>
    <form id="composer" class="border-t border-neutral-200 p-3">
      <div class="rounded-xl border border-neutral-300 bg-white transition-shadow focus-within:border-indigo-400 focus-within:ring-2 focus-within:ring-indigo-100">
        <div id="image-strip" class="hidden flex-wrap gap-2 px-3 pt-2.5"></div>
        <textarea id="input" rows="2"
          class="block w-full resize-none bg-transparent px-3 py-2.5 focus:outline-none"
          placeholder="Message…"></textarea>
        <div class="flex items-center gap-2 px-2 pb-2">
          <button type="button" id="attach" title="Attach image (or paste / drop)"
            class="flex h-7 w-7 flex-none items-center justify-center rounded-md text-[17px] leading-none text-neutral-400 hover:bg-neutral-100 hover:text-neutral-600">+</button>
          <input id="attach-input" type="file" accept="image/*" multiple class="hidden" />
          <span id="state-chip" class="flex items-center gap-1.5 text-[12px] text-neutral-400"></span>
          <div class="ml-auto flex items-center gap-1">
            <button type="button" id="stop"
              class="hidden rounded-lg px-2.5 py-1 text-[13px] text-red-600 hover:bg-red-50">Stop</button>
            <button type="button" id="send-now"
              class="hidden rounded-lg px-2.5 py-1 text-[13px] text-neutral-500 hover:bg-neutral-100 hover:text-neutral-700">Send now</button>
            <button type="submit" id="send"
              class="rounded-lg bg-indigo-600 px-3.5 py-1 text-[13px] font-medium text-white hover:bg-indigo-500 active:bg-indigo-700">Send</button>
          </div>
        </div>
      </div>
    </form>
  </main>

  <dialog id="new-dialog" class="m-auto w-96 rounded-xl border border-neutral-200 p-4 shadow-xl backdrop:bg-black/20">
    <form id="new-form" method="dialog" class="flex flex-col gap-3">
      <h3 class="font-semibold">New session</h3>
      <label class="flex flex-col gap-1 text-[13px] text-neutral-600">
        Working directory
        <input id="new-cwd" type="text" placeholder="server default" list="known-projects"
          class="rounded-md border border-neutral-300 px-2 py-1.5 font-mono text-[13px] focus:border-indigo-400 focus:outline-none" />
        <datalist id="known-projects"></datalist>
      </label>
      <div class="flex justify-end gap-2">
        <button type="button" id="new-cancel" class="btn text-[13px]">Cancel</button>
        <button type="submit" class="btn btn-primary text-[13px]">Create</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/main.ts"></script>
</body>
</html>
