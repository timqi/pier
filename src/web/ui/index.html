<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover lets the safe-area insets in style.css do their job
       under an iPhone's home indicator. No user scaling: a fixed-viewport
       workbench zoomed by a stray gesture has no visible way back — said again
       as `touch-action` (style.css) for the engines that ignore this pair. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f9f8" />
  <!-- Ahead of the stylesheet, because a workbench that flashes white and then
       goes dark reads as a bug. This is the only place "system" is resolved
       before the bundle exists; theme.ts owns the choice from there on. -->
  <script>
    var t;
    try { t = localStorage.getItem("pier.theme"); }
    catch (e) { /* storage denied: follow the system for this visit */ }
    var mode = t === "light" || t === "dark" ? t
      : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = mode;
    // Before CSS loads, mirror its canvas token so installed chrome never flashes.
    document.querySelector('meta[name="theme-color"]').content = mode === "dark" ? "#181c1f" : "#f7f9f8";
  </script>
  <!-- Installed as a home-screen app: standalone window, own icon. The
       manifest shares the workbench's cookie boundary. -->
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
  <!-- SVG first (scales to any tab/bookmark size), 32px PNG for the engines
       that still ignore it. iOS wants an opaque square and rounds it itself. -->
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
  <link rel="apple-touch-icon" href="/icon-touch-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Pier" />
  <!-- Without this iOS paints the status-bar strip in a system grey that
       belongs to no part of the app. Translucent hands the strip to the page,
       which style.css pays for with the safe-area inset. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Pier</title>
</head>
<!-- The document never scrolls: this is a fixed-viewport workbench, and every
     scrollable region is an inner pane. h-dvh, not h-screen, because 100vh can
     exceed the visible viewport (mobile chrome, short windows) — that gap is
     what lets the whole app slide up and take the sidebar with it. -->
<body class="grid h-dvh grid-cols-1 overflow-hidden text-[16px] leading-[1.45] text-neutral-800 antialiased md:grid-cols-[14.5rem_minmax(0,1fr)]">
  <!-- Below md the aside leaves the grid and slides in as a drawer (style.css);
       the scrim is its dismiss target and never paints on desktop. -->
  <div id="drawer-scrim" class="fixed inset-0 z-30 hidden bg-black/25 md:hidden"></div>
  <!-- Desktop only: one sidebar toggle. Fixed in the title band — style.css
       moves it between the rail's top-right (open) and main's top-left
       (closed), flipping the chevron, so expand and collapse are the same
       control in the same band. -->
  <button type="button" id="rail-toggle" aria-label="Toggle sidebar"
    class="fixed top-1.5 z-40 hidden h-7 w-7 cursor-pointer items-center justify-center rounded-md text-neutral-400 hover:bg-neutral-200 hover:text-neutral-700 md:flex">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" class="h-3.5 w-3.5">
      <path d="M9.5 4 5.5 8l4 4" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
  <aside id="sidebar" class="flex flex-col overflow-hidden border-r border-neutral-200 bg-neutral-50 font-sans">
    <header class="flex h-12 flex-none items-center gap-2 px-3">
      <!-- The same mark as the tab and the home-screen icon, so an installed
           Pier looks like the thing you installed. -->
      <img src="/icon.svg" alt="" width="20" height="20" class="h-7 w-7 flex-none rounded-lg border border-neutral-200/70 bg-white p-1 shadow-xs" />
      <h1 class="text-[17px] font-semibold tracking-tight">Pier</h1>
      <!-- A link, not a label: AGPL-3.0 section 13 asks a network service to
           point its users at the source it is running. Beside the title
           because a version is something you look up, not something you find
           by scrolling to the bottom. -->
      <a id="version" href="https://github.com/timqi/pier" target="_blank" rel="noreferrer"
        title="Pier is free software (AGPL-3.0) — the source of what you are using"
        class="font-mono text-[11px] text-neutral-400 hover:text-neutral-700 hover:underline"></a>
      <!-- Cycles system → light → dark; the glyph is what is on screen, the
           title says which of the three states put it there. Beside the
           version rather than at the header's right edge, which is where the
           fixed rail toggle lands. -->
      <button type="button" id="theme-toggle" aria-label="Theme"
        class="icon-btn text-[13px]"></button>
    </header>
    <div class="flex flex-none items-center gap-1.5 px-3 pb-1">
      <button type="button" id="new-session" aria-label="New session"
        class="btn btn-primary flex min-w-0 flex-1 items-center justify-center gap-2 whitespace-nowrap px-3">
        <span aria-hidden="true">＋</span> New session
      </button>
      <button type="button" id="open-archive" aria-label="Search sessions and Console"
        class="btn flex h-8 w-8 flex-none items-center justify-center bg-neutral-100 p-0 text-neutral-600 hover:bg-neutral-200 active:bg-neutral-300">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" class="h-5 w-5 flex-none">
          <circle cx="7" cy="7" r="4.25" /><path d="M10.2 10.2 14 14" stroke-linecap="round" />
        </svg>
        <span class="sr-only">Search</span>
      </button>
    </div>
    <details id="console-section" open class="flex-none border-b border-neutral-200/70">
      <summary class="flex cursor-pointer select-none items-center gap-1 px-3 py-1 text-xs font-semibold leading-5 text-neutral-500 hover:bg-neutral-100">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" class="chev h-3 w-3"><path d="m6 4 4 4-4 4" stroke-linecap="round" stroke-linejoin="round" /></svg>Console
      </summary>
      <ul class="pb-1">
        <!-- One row for the tasks area: Tasks, Runs and Activity are tabs of
             the Automation page (views.ts), not three sidebar entries. -->
        <li><button type="button" id="open-tasks"
          class="flex w-full cursor-pointer items-center gap-2 py-1.5 pl-6 pr-3 text-left hover:bg-neutral-100">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" class="h-3.5 w-3.5 flex-none text-neutral-400">
            <path d="M6 3h8M6 8h8M6 13h8M2 3h1M2 8h1M2 13h1" />
          </svg>Automation</button></li>
        <li><button type="button" id="open-boards"
          class="flex w-full cursor-pointer items-center gap-2 py-1.5 pl-6 pr-3 text-left hover:bg-neutral-100">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" class="h-3.5 w-3.5 flex-none text-neutral-400">
            <rect x="2" y="2" width="12" height="12" rx="1.5" /><path d="M2 6.5h12M6.5 6.5V14" />
          </svg>Boards</button></li>
        <li><button type="button" id="open-settings"
          class="flex w-full cursor-pointer items-center gap-2 py-1.5 pl-6 pr-3 text-left hover:bg-neutral-100">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" class="h-3.5 w-3.5 flex-none text-neutral-400">
            <!-- Teeth every 60° about (8,8); the hub is that same centre. -->
            <path d="M6.8 2.2h2.4l.32 1.6a4.9 4.9 0 0 1 1.36.79l1.55-.53 1.2 2.08-1.23 1.07a4.9 4.9 0 0 1 0 1.58l1.23 1.07-1.2 2.08-1.55-.53a4.9 4.9 0 0 1-1.36.79l-.32 1.6H6.8l-.32-1.6a4.9 4.9 0 0 1-1.36-.79l-1.55.53-1.2-2.08 1.23-1.07a4.9 4.9 0 0 1 0-1.58L2.37 6.14l1.2-2.08 1.55.53a4.9 4.9 0 0 1 1.36-.79z" stroke-linejoin="round" />
            <circle cx="8" cy="8" r="1.9" />
          </svg>Settings</button></li>
      </ul>
    </details>
    <div class="flex-none px-3 pb-1 pt-2 text-xs font-semibold leading-5 text-neutral-500">Sessions</div>
    <div id="session-list" class="min-h-0 flex-1 overflow-y-auto"></div>
  </aside>

  <main class="flex min-w-0 flex-col overflow-hidden">
    <!-- Mobile top bar: replaces the chat header below md (which hides), so a
         Console view keeps the same way back to the drawer as a chat does. -->
    <header id="mobile-bar" class="flex h-12 flex-none items-center gap-1 border-b border-neutral-200 px-1.5 md:hidden">
      <button type="button" id="drawer-toggle" aria-label="Open sidebar"
        class="relative flex h-10 w-10 flex-none cursor-pointer items-center justify-center rounded-md text-neutral-500 active:bg-neutral-200">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" class="h-5 w-5">
          <path d="M2.5 4h11M2.5 8h11M2.5 12h11" />
        </svg>
      </button>
      <span id="mobile-title" class="min-w-0 flex-1 truncate text-[16px] font-medium"></span>
      <button type="button" id="mobile-menu" aria-label="Session actions"
        class="hidden h-10 w-10 flex-none cursor-pointer items-center justify-center rounded-md text-[20px] leading-none text-neutral-500 active:bg-neutral-200">⋯</button>
    </header>
    <!-- Automation hosts three views under one title and tab strip; the
         strip's active pill tracks the route (#/tasks, #/runs, #/activity). -->
    <section id="automation-view" class="hidden min-h-0 flex-1 flex-col">
      <header class="flex h-10 flex-none items-center gap-3 border-b border-neutral-200 bg-white px-4 max-md:hidden">
        <span class="font-medium">Automation</span>
      </header>
      <div id="automation-tabs" class="tabstrip bg-white"></div>
      <section id="tasks-view" class="hidden min-h-0 flex-1 flex-col"></section>
      <section id="runs-view" class="hidden min-h-0 flex-1 flex-col"></section>
      <section id="activity-view" class="hidden min-h-0 flex-1 flex-col"></section>
    </section>
    <section id="boards-view" class="hidden min-h-0 flex-1 flex-col"></section>
    <section id="settings-view" class="hidden min-h-0 flex-1 flex-col"></section>
    <section id="files-view" class="hidden min-h-0 flex-1 flex-col"></section>
    <header id="chat-header" class="flex h-10 flex-none items-center gap-2 border-b border-neutral-200 px-4 max-md:hidden">
      <span id="chat-title" class="truncate font-medium"></span>
      <!-- Right cluster: meta chips sit flush against the ⋯ button. Two
           ml-autos would split the free space, so one wrapper owns it. -->
      <div class="ml-auto flex flex-none items-center gap-1.5">
        <!-- Inline session meta: model · reasoning · current context size. -->
        <div id="session-meta" class="hidden flex-none items-center gap-1 text-[11px]"></div>
        <button type="button" id="chat-menu" title="Session actions" aria-label="Session actions"
          class="icon-btn">⋯</button>
      </div>
    </header>
    <!-- The transcript's own type scale, inherited by rows, chips and markdown. -->
    <!-- data-gallery: the lightbox pages within the container it was opened
         from (see attachments.ts), so transcript and pending strip stay apart. -->
    <div id="turns" data-gallery class="flex-1 overflow-y-auto pb-5 pt-2 text-[15px] leading-[1.55]"></div>
    <!-- Pi's queue primitives are whole-queue (steer / clear), so the actions
         live on the header row and read as "the queue", never per message. -->
    <div id="queue-panel" class="hidden flex-col border-t border-neutral-200 px-3 py-1.5">
      <div class="flex h-7 items-center gap-2">
        <span id="queue-label" class="text-[11px] font-semibold uppercase tracking-wide text-amber-700">Queued</span>
        <div class="ml-auto flex items-center gap-0.5 text-amber-700">
          <button type="button" id="queue-steer" title="Send the whole queue now into the running turn" aria-label="Send queue now"
            class="flex h-7 w-7 cursor-pointer items-center justify-center rounded-md hover:bg-amber-100 active:bg-amber-200">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5">
              <path d="M14.5 1.5 7 9m7.5-7.5-4.2 12.6L7 9 1.7 6.7l12.8-5.2z" />
            </svg>
          </button>
          <button type="button" id="queue-restart" title="Stop the running turn and send the whole queue as a new prompt" aria-label="Stop and send queue"
            class="flex h-7 w-7 cursor-pointer items-center justify-center rounded-md hover:bg-amber-100 active:bg-amber-200">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5">
              <!-- The arc's ink sits high-right of the box; centre it so the
                   three icons share one baseline. -->
              <g transform="translate(-0.8 1.9)">
                <path d="M13 5.2V1.8m0 0H9.6M13 1.8A6 6 0 1 0 14 9" />
                <path d="M6.2 8h4M8.5 5.7 10.8 8l-2.3 2.3" />
              </g>
            </svg>
          </button>
          <button type="button" id="queue-recall" title="Return queued messages to the composer" aria-label="Recall queued messages"
            class="flex h-7 w-7 cursor-pointer items-center justify-center rounded-md hover:bg-amber-100 active:bg-amber-200">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5">
              <!-- Ink centred on the 16×16 box, or the glyph sits low next to its neighbours. -->
              <path d="M5 3 2 6l3 3M2.5 6H10a3.5 3.5 0 0 1 0 7H8" />
            </svg>
          </button>
        </div>
      </div>
      <!-- Rows wrap, so the list grows with the queue and scrolls past ~5 lines
           (18px leading) rather than shrinking the turns pane any further. -->
      <ul id="queue-rows" class="flex max-h-[6rem] flex-col gap-1 overflow-y-auto overscroll-contain"></ul>
    </div>
    <form id="composer" class="flex-none px-4 pb-3 pt-2">
      <div class="glass rounded-[1.75rem] border border-neutral-200 px-3 py-2.5 transition-shadow focus-within:border-indigo-400">
        <div id="image-strip" data-gallery class="hidden flex-wrap gap-2 px-1 pb-1.5 pt-1"></div>
        <!-- items-end keeps the icons on the bottom row while the textarea grows upward -->
        <div class="flex items-end gap-1.5">
          <button type="button" id="attach" title="Attach file (or paste / drop)"
            class="flex h-7 w-7 flex-none cursor-pointer items-center justify-center rounded-lg text-[17px] leading-none text-neutral-400 hover:bg-neutral-100 hover:text-neutral-600">+</button>
          <input id="attach-input" type="file" multiple class="hidden" />
          <textarea id="input" rows="1"
            class="block max-h-48 min-w-0 flex-1 resize-none bg-transparent px-1 py-0.5 focus:outline-none"
            placeholder="Message…"></textarea>
          <button type="button" id="stop" title="Stop the running turn"
            class="hidden h-7 w-7 flex-none cursor-pointer items-center justify-center rounded-lg bg-red-50 text-red-600 hover:bg-red-100">
            <svg viewBox="0 0 16 16" fill="currentColor" class="h-3.5 w-3.5">
              <rect x="3.5" y="3.5" width="9" height="9" rx="1.5" />
            </svg>
          </button>
          <!-- Style + icon double as the state display: indigo plane = send, amber clock = queue -->
          <button type="submit" id="send" title="Send">
            <svg id="send-plane" viewBox="0 0 16 16" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5">
              <path d="M14.5 1.5 7 9m7.5-7.5-4.2 12.6L7 9 1.7 6.7l12.8-5.2z" />
            </svg>
            <svg id="send-queue" viewBox="0 0 16 16" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" class="hidden h-3.5 w-3.5">
              <circle cx="8" cy="8" r="6" />
              <path d="M8 4.75V8l2.4 1.5" />
            </svg>
          </button>
        </div>
      </div>
    </form>
  </main>

  <dialog id="new-dialog" class="m-auto w-[min(24rem,92vw)] rounded-3xl border border-neutral-200 p-5 shadow-xl backdrop:bg-black/20">
    <form id="new-form" method="dialog" class="flex flex-col gap-3">
      <h3 class="font-semibold">New session</h3>
      <label class="flex flex-col gap-1 text-[13px] text-neutral-600">
        Working directory
        <input id="new-cwd" type="text" required placeholder="/path/to/project"
          class="w-full rounded-md border border-neutral-300 px-2 py-1.5 font-mono text-[13px] focus:border-indigo-400 focus:outline-none" />
      </label>
      <div class="flex justify-end gap-2">
        <button type="button" id="new-cancel" class="btn text-[13px]">Cancel</button>
        <button type="submit" class="btn btn-primary text-[13px]">Create</button>
      </div>
    </form>
  </dialog>

  <!-- Not m-auto: a palette that grows downward as you type should not also
       drift upward to stay centred. Pinned near the top instead, which is
       where the eye already is and where every other ⌘K lives. -->
  <dialog id="archive-dialog" class="mx-auto mb-auto mt-[12vh] w-[35rem] max-w-[90vw] rounded-3xl border border-neutral-200 p-0 shadow-xl backdrop:bg-black/20">
    <div class="flex items-center gap-2 border-b border-neutral-200 px-3 py-2">
      <input id="archive-search" type="text" placeholder="Search sessions and Console…"
        class="w-full bg-transparent text-[14px] focus:outline-none" />
      <span id="archive-count" class="flex-none rounded bg-neutral-100 px-1.5 text-[11px] text-neutral-500"></span>
      <button type="button" id="archive-close" class="btn flex-none text-[12px]">Close</button>
    </div>
    <ul id="archive-list" class="max-h-[60vh] overflow-y-auto py-1 text-[13.5px]"></ul>
  </dialog>

  <!-- Full-size view of a thumbnail; a single click (or Esc) closes, a double
       one zooms about the point. The arrows page through the gallery it was
       opened from, as do ← / →; they hide when there is only one image to look
       at. The dialog fills the viewport rather than hugging the image, so the
       arrows sit at the screen's edges and a tall shot and a wide one don't
       move the control under your thumb; #image-stage is the box a zoomed
       image scrolls inside (ui/attachments.ts). -->
  <!-- The size is written out, not left to `inset-0`: a dialog is `width:
       fit-content` in the UA sheet, and an inset pair does not stretch a box
       that already has a width — it sized itself to the image and sat in the
       top-left corner, with the backdrop clicks landing on the dialog instead
       of on #image-stage. -->
  <dialog id="image-dialog" class="fixed inset-0 m-0 h-[100dvh] w-full max-h-none max-w-none bg-transparent p-0 backdrop:bg-black/70">
    <div id="image-stage" class="flex h-full w-full items-center justify-center overflow-hidden">
      <img id="image-full" alt="" class="max-h-[92dvh] max-w-[92vw] cursor-zoom-in rounded-xl object-contain" />
    </div>
    <!-- Siblings of the stage, not children of it: the stage is what scrolls
         when zoomed, and an arrow inside it would scroll away with the image. -->
    <button type="button" id="image-prev" aria-label="Previous image" class="lightbox-nav left-2">‹</button>
    <button type="button" id="image-next" aria-label="Next image" class="lightbox-nav right-2">›</button>
  </dialog>

  <!-- Text preview of an agent attachment — the Files view's code pane fills
       #file-text; download stays one click away. -->
  <dialog id="file-dialog" class="m-auto w-[45rem] max-w-[92vw] rounded-3xl border border-neutral-200 p-0 shadow-xl backdrop:bg-black/40">
    <div class="flex items-center gap-2 border-b border-neutral-200 px-3 py-2">
      <span id="file-name" class="min-w-0 flex-1 truncate font-mono text-[12.5px] text-neutral-700"></span>
      <a id="file-download" download class="btn flex-none text-[12px] no-underline">Download</a>
      <button type="button" id="file-close" class="btn flex-none text-[12px]">Close</button>
    </div>
    <div id="file-text" class="max-h-[70vh] overflow-auto"></div>
  </dialog>

  <!-- Before the bundle, and only until it loads: a module that throws while
       evaluating leaves a blank page, no handler installed and nothing in the
       server's log. ui/report.ts takes over by setting the flag below.
       Signed-in only, like every other /api route: this page is not served to
       anyone else, and a stranger who could write the journal would own it. -->
  <script>
    addEventListener("error", function (e) {
      // A throw inside an error handler is reported as another error: anything
      // missing here has to be a silent return, not an exception.
      if (window.__pierReporting || !navigator.sendBeacon) return;
      var body = JSON.stringify({ message: "boot error: " + e.message, view: location.hash });
      navigator.sendBeacon("/api/client-log", new Blob([body], { type: "application/json" }));
    });
  </script>
  <script type="module" src="/main.ts"></script>
</body>
</html>
