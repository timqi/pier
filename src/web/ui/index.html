<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pier</title>
</head>
<body class="grid h-screen grid-cols-[230px_minmax(0,1fr)] text-[16px] leading-[1.45] text-neutral-800 antialiased">
  <aside class="flex flex-col overflow-hidden border-r border-neutral-200 bg-neutral-50">
    <header class="flex items-center justify-between gap-2 px-3 py-2">
      <h1 class="text-[15px] font-semibold tracking-tight">Pier</h1>
    </header>
    <details id="console-section" open class="flex-none border-b border-neutral-200/70">
      <summary class="flex cursor-pointer select-none items-center gap-1 px-3 pb-1 pt-2 text-[11px] font-semibold uppercase tracking-wide text-neutral-500 hover:bg-neutral-100">
        <span class="chev">▶</span>Console
      </summary>
      <ul class="pb-1 text-[13.5px]">
        <li><button type="button" id="open-config"
          class="block w-full cursor-pointer py-1.5 pl-6 pr-3 text-left hover:bg-neutral-100">Configuration</button></li>
      </ul>
    </details>
    <div class="flex items-center gap-1 px-3 pb-1 pt-2 text-[11px] font-semibold uppercase tracking-wide text-neutral-500">
      Projects
      <button type="button" id="open-archive" title="Search all sessions"
        class="icon-btn ml-auto" aria-label="Search all sessions">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" class="h-3.5 w-3.5">
          <circle cx="7" cy="7" r="4.25" /><path d="M10.2 10.2 14 14" stroke-linecap="round" />
        </svg>
      </button>
      <button type="button" id="new-session" title="New session"
        class="icon-btn" aria-label="New session">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" class="h-3.5 w-3.5">
          <rect x="2.25" y="2.25" width="11.5" height="11.5" rx="2.5" />
          <path d="M8 5.5v5M5.5 8h5" stroke-linecap="round" />
        </svg>
      </button>
    </div>
    <div id="project-tree" class="flex-1 overflow-y-auto text-[13.5px]"></div>
    <footer class="flex flex-none items-center gap-2 border-t border-neutral-200 px-3 py-1.5 text-[11px] text-neutral-400">
      Pier
      <span id="version" class="ml-auto font-mono"></span>
    </footer>
  </aside>

  <main class="flex min-w-0 flex-col overflow-hidden">
    <section id="config-view" class="hidden min-h-0 flex-1 flex-col"></section>
    <header id="chat-header" class="flex h-10 flex-none items-center gap-2 border-b border-neutral-200 px-4">
      <span id="chat-title" class="truncate font-medium"></span>
      <button type="button" id="chat-menu" title="Session actions" aria-label="Session actions"
        class="icon-btn ml-auto">⋯</button>
    </header>
    <div id="turns" class="flex-1 overflow-y-auto pb-4 pt-1"></div>
    <div id="queue-panel" class="hidden flex-col gap-1 border-t border-amber-200 bg-amber-50/60 px-3 py-2">
      <div class="flex items-center">
        <span class="text-[11px] font-semibold uppercase tracking-wide text-amber-700">Queued</span>
        <div class="ml-auto flex items-center gap-3 text-[12px] text-amber-700">
          <button type="button" id="queue-steer" title="Deliver now, interrupting the running turn"
            class="cursor-pointer underline-offset-2 hover:underline">Send now</button>
          <button type="button" id="queue-restart" title="Abort the running turn and send as a new prompt"
            class="cursor-pointer underline-offset-2 hover:underline">Abort &amp; send</button>
          <button type="button" id="queue-recall"
            class="cursor-pointer underline-offset-2 hover:underline">Recall all</button>
        </div>
      </div>
      <ul id="queue-rows" class="flex flex-col gap-1"></ul>
    </div>
    <form id="composer" class="border-t border-neutral-200 p-3">
      <div class="rounded-xl border border-neutral-300 bg-white transition-shadow focus-within:border-indigo-400 focus-within:ring-2 focus-within:ring-indigo-100">
        <div id="image-strip" class="hidden flex-wrap gap-2 px-3 pt-2.5"></div>
        <textarea id="input" rows="2"
          class="block w-full resize-none bg-transparent px-3 py-2.5 focus:outline-none"
          placeholder="Message…"></textarea>
        <div class="flex items-center gap-2 px-2 pb-2">
          <button type="button" id="attach" title="Attach image (or paste / drop)"
            class="flex h-7 w-7 flex-none items-center justify-center rounded-md text-[17px] leading-none text-neutral-400 hover:bg-neutral-100 hover:text-neutral-600">+</button>
          <input id="attach-input" type="file" accept="image/*" multiple class="hidden" />
          <span id="state-chip" class="flex items-center gap-1.5 text-[12px] text-neutral-400"></span>
          <div class="ml-auto flex items-center gap-1">
            <button type="button" id="stop"
              class="hidden rounded-lg px-2.5 py-1 text-[13px] text-red-600 hover:bg-red-50">Stop</button>
            <button type="button" id="send-now"
              class="hidden rounded-lg px-2.5 py-1 text-[13px] text-neutral-500 hover:bg-neutral-100 hover:text-neutral-700">Send now</button>
            <button type="submit" id="send"
              class="rounded-lg bg-indigo-600 px-3.5 py-1 text-[13px] font-medium text-white hover:bg-indigo-500 active:bg-indigo-700">Send</button>
          </div>
        </div>
      </div>
    </form>
  </main>

  <dialog id="new-dialog" class="m-auto w-96 rounded-xl border border-neutral-200 p-4 shadow-xl backdrop:bg-black/20">
    <form id="new-form" method="dialog" class="flex flex-col gap-3">
      <h3 class="font-semibold">New session</h3>
      <label class="flex flex-col gap-1 text-[13px] text-neutral-600">
        Working directory
        <input id="new-cwd" type="text" required placeholder="/path/to/project" list="known-projects"
          class="rounded-md border border-neutral-300 px-2 py-1.5 font-mono text-[13px] focus:border-indigo-400 focus:outline-none" />
        <datalist id="known-projects"></datalist>
      </label>
      <div class="flex justify-end gap-2">
        <button type="button" id="new-cancel" class="btn text-[13px]">Cancel</button>
        <button type="submit" class="btn btn-primary text-[13px]">Create</button>
      </div>
    </form>
  </dialog>

  <dialog id="archive-dialog" class="m-auto w-[560px] max-w-[90vw] rounded-xl border border-neutral-200 p-0 shadow-xl backdrop:bg-black/20">
    <div class="flex items-center gap-2 border-b border-neutral-200 px-3 py-2">
      <input id="archive-search" type="text" placeholder="Search all sessions…"
        class="w-full bg-transparent text-[14px] focus:outline-none" />
      <span id="archive-count" class="flex-none rounded bg-neutral-100 px-1.5 text-[11px] text-neutral-500"></span>
      <button type="button" id="archive-close" class="btn flex-none text-[12px]">Close</button>
    </div>
    <ul id="archive-list" class="max-h-[60vh] overflow-y-auto py-1 text-[13.5px]"></ul>
  </dialog>

  <script type="module" src="/main.ts"></script>
</body>
</html>
