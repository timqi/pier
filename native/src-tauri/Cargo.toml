[package]
name = "pier-client"
version = "0.1.0"
description = "Pier native client: one window over many Pier instances"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` is the multi-webview API: one child webview per instance in one window.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Already in the build through tauri: GTK lays child webviews out in a box, not by position.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
