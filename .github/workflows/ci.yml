# Everything `just` would run locally, on the one Node version Pier supports.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a PR makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      # ci, not install: the lockfile is the dependency review (AGENTS.md 8),
      # so a run that quietly resolved something else proves nothing.
      - run: npm ci
      # high fails the run; moderates only show in the log, so a transitive one nobody can fix does not block main.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run lint
      - run: npm test
      # Last, and not optional: type-checking passes on code vite cannot build.
      - run: npm run build
