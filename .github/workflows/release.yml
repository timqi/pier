# A tag becomes a published npm package and a GitHub Release, with the log
# since the previous tag as its notes. npm first: a release pointing at a
# version nobody can install is worse than a tag with no release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Provenance: npm records that this tarball was built by this workflow from
  # this commit, which is the only part of "trust the package" we can automate.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the previous tag is what the notes are diffed against
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org

      # The footer shows package.json's version, so a tag that disagrees with it
      # would put a number on screen that names no commit.
      - name: Check the tag against package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          test "$tag" = "$pkg" || {
            echo "tag $GITHUB_REF_NAME does not match package.json $pkg" >&2
            exit 1
          }

      # A tag that does not build is not a release, even though CI already ran
      # on the commit: the tag is what people will check out.
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Notes from the log
        run: |
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            if [ -n "$prev" ]; then
              echo "Changes since $prev:"
              echo
              git log --no-merges --pretty='- %s' "$prev..${GITHUB_REF_NAME}"
            else
              echo "First tagged release."
            fi
            echo
            echo "\`pier update\` stops the service and writes a copy of the database to"
            echo "\`~/.pier/db/backups/\` before installing. Schema migrations are one-way."
            echo "See \`docs/deploy.md\`."
          } > notes.md

      # `prepack` rebuilds inside the pack, so what ships is what this job just
      # verified. Access and provenance come from publishConfig in package.json.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
